name: estudos-ia

services:
  postgres:
    image: postgres:18
    container_name: estudos-ia-postgres
    environment:
      POSTGRES_DB: estudos-ia
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - estudos-ia_postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  estudos-ia_postgres_data:
